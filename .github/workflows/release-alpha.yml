name: release-alpha

# Branch-scoped workflow that OWNS `development`. On PRs into development it runs
# the CI check jobs (lint + breaking + build) that satisfy the development
# ruleset's required status checks; on push/dispatch to development it mints an
# alpha prerelease.
#
# alpha tag/release: the shared resolve-version action (ScoutSportTechnology/.github)
# bumps the base from the latest stable tag via Conventional Commits (release
# floor while a release/X.Y.Z is open), then appends the next -alpha.N counter. Docs/chore-
# only merges resolve to released=false and mint nothing. This repo is artifact-
# free: the tag IS the release, so there is NO asset — consumers vendor the
# submodule and pin a tag's commit. The alpha is the contract validated by the
# check jobs (lint+breaking+build) in isolation, before it is proven against real
# consumers (that is the beta rung).
#
# Uses the default GITHUB_TOKEN: tagging + cutting a (pre)release is
# contents:write, and the "Release Tags" ruleset permits creating compliant
# v* tags. No PAT or GitHub App needed.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v0.1.0 (seeds the alpha line)"
        required: false
        default: ""
      bump:
        description: "Force base bump level (overrides commit scan)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names lint and breaking are the required status checks wired into the
  # branch rulesets — keep them byte-identical. `build` (buf build) is the
  # codegen-compile smoke; it is wired in alongside them. No language codegen
  # here: both consumers vendor proto as a git submodule and generate their own
  # bindings, so this repo ships only the .proto contract + a version tag.
  # These run on PRs only; push/dispatch goes straight to the alpha job.

  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          # This job only lints — disable the other steps the action runs.
          format: false
          breaking: false
          push: false
          # Org disables Actions commenting on PRs (GITHUB_TOKEN can't write
          # issue comments) — failures surface as annotations + job status.
          pr_comment: false

  breaking:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so buf can diff against the main branch.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # buf breaking vs main; a wire break passes only when the PR title
      # declares it (`type!:` / `type(scope)!:`). See the script header.
      - name: buf breaking (declared breaks allowed)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/breaking-gate.sh

  build:
    # Codegen-compile smoke: `buf build` compiles the schema into a
    # FileDescriptorSet — the cheapest "the schemas still compile" check with no
    # language toolchain. This is the alpha-ladder "codegen succeeds" rung.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          breaking: false
          push: false
          # buf-action runs `buf build` as part of setup/validation; keep the
          # other steps off so this job is the compile-smoke only.
          pr_comment: false

  alpha:
    # Push (merge) to development or manual dispatch — never on PRs (those run the
    # check jobs above).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, tags and branches: the shared resolver reads the
          # latest stable tag, the -alpha.N counters and open release/* branches.
          fetch-depth: 0

      - name: Resolve next alpha tag
        id: ver
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: alpha
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}

      - name: Publish alpha prerelease (no asset)
        if: steps.ver.outputs.released == 'true'
        uses: ScoutSportTechnology/.github/actions/publish-release@v1.1.0
        with:
          tag: ${{ steps.ver.outputs.tag }}
          prerelease: "true"
