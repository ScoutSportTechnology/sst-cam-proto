name: release

# Auto-release on merge to main. A conventional-commit scan of the commits since
# the last tag decides the bump (feat -> minor, fix/perf -> patch, BREAKING ->
# major) and SKIPS entirely when only docs/chore/ci/test/refactor landed — so
# trivial merges don't cut releases. workflow_dispatch is kept as a manual
# override (force a version or bump level).
#
# Uses the default GITHUB_TOKEN: tagging + cutting a Release is contents:write
# (allowed), and the "Release Tags" ruleset permits creating compliant semver
# tags (it only blocks delete/update/force-push). No PAT or GitHub App needed.
# The tag is the source of truth for the version; gen/dart/pubspec.yaml is not
# auto-bumped (a push to main is blocked by branch protection) — the app pins the
# package by git ref vX.Y.Z, not by that field.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version tag eg v1.2.3 (overrides auto-detect)"
        required: false
        default: ""
      bump:
        description: "Force bump level (overrides auto-detect)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.ver.outputs.released }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version (conventional-commit aware)
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"; latest="${latest:-v0.0.0}"
          ver="${latest#v}"; MA="${ver%%.*}"; rest="${ver#*.}"; MI="${rest%%.*}"; PA="${rest##*.}"

          # Manual override: explicit version wins.
          if [ -n "${IN_VERSION:-}" ]; then
            echo "$IN_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::invalid version '$IN_VERSION'"; exit 1; }
            echo "tag=$IN_VERSION" >> "$GITHUB_OUTPUT"; echo "released=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          bump="${IN_BUMP:-}"
          if [ -z "$bump" ]; then
            # Auto-detect from conventional commits since the last tag.
            if git rev-parse -q --verify "refs/tags/${latest}" >/dev/null 2>&1; then
              range="${latest}..HEAD"
            else
              range="HEAD"   # no tags yet — scan all history
            fi
            log="$(git log --format='%s%n%b' ${range})"
            if echo "$log" | grep -qiE '^BREAKING[ -]CHANGE' || echo "$log" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              bump=major
            elif echo "$log" | grep -qE '^feat(\(.+\))?:'; then
              bump=minor
            elif echo "$log" | grep -qE '^(fix|perf)(\(.+\))?:'; then
              bump=patch
            fi
          fi

          if [ -z "$bump" ]; then
            echo "No releasable (feat/fix/perf/BREAKING) commits since ${latest} — skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          tag="v${MA}.${MI}.${PA}"
          echo "Releasing ${tag} (bump=${bump}, since ${latest})"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"; echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create tag + GitHub Release
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
