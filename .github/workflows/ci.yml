name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Job names below (lint, breaking) are the required status checks configured
  # on the `main` branch ruleset — keep them stable. No codegen here: both
  # consumers vendor proto as a git submodule and generate their own bindings,
  # so this repo ships only the .proto contract + a version tag.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          # This job only lints — disable the other steps the action runs.
          format: false
          breaking: false
          push: false
          # Org disables Actions commenting on PRs (GITHUB_TOKEN can't write
          # issue comments) — failures surface as annotations + job status.
          pr_comment: false

  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so buf can diff against the main branch.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          breaking: true
          breaking_against: "https://github.com/ScoutSportTechnology/sst-cam-proto.git#branch=main"
          pr_comment: false
