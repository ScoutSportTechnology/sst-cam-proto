syntax = "proto3";

package sst_cam;

// ---------------------------------------------------------------------------
// SST-Cam Bluetooth (BLE GATT) protocol — single source of truth.
//
// Channel role:
//   * BLE = control plane. Every command/response in this file rides the
//     two GATT characteristics defined in proto/README.md (Command Write +
//     Command Response Notify), wrapped in `ChunkedPayload` for MTU framing.
//   * WiFi Direct = data plane. See wifi.proto for the bulk-data contracts
//     (RTSP H.264 preview, HTTP recording downloads). The BLE side
//     negotiates the WiFi group via StartWifiDirectCommand →
//     WifiDirectGroupResponse (both defined here).
//
// Architecture — app is source of truth:
//   The app owns all business data (users, teams, rosters, match configs,
//   streaming destinations). The camera is a stateless executor: it receives
//   a session config once per session, reacts to events pushed by the app
//   (recording control, match events, score updates), and produces files.
//   The camera NEVER pushes unsolicited data and NEVER persists business data
//   across sessions. See docs/firmware-spec.md for the full contract.
//
// History:
//   Consolidated from six smaller files (command, telemetry, match, recording,
//   team, config). During the merge:
//     * Sport was deduplicated to match.proto's superset.
//     * PlayerInfo.position retyped from string to PlayerPosition enum.
//     * DownloadTokenResponse field numbers fixed.
//   Post-consolidation:
//     * MatchConfigCommand tombstoned — replaced by PushSessionConfigCommand.
//     * WifiDirect commands + response moved here from wifi.proto.
//     * RecordingAction gained PAUSE / RESUME.
//     * MatchControlCommand gained period field; MatchControlAction redesigned.
//     * DeviceTelemetry gained battery_level_pct.
//     * PushSessionConfigCommand gained team name/color fields.
//     * OverlayElement.visible and OverlayStyle.opacity made proto3 `optional`
//       so consumers detect unset via has_*() and apply documented defaults
//       (visible=>true, opacity=>1.0). Wire-compatible; no protocol_version bump.
//     * Raw dual-camera capture: RawCaptureControlCommand (Command oneof 34),
//       RecordingMetadata.is_raw/camera_index/capture_group_id (8-10) under a
//       joint presence invariant, DeviceTelemetry.is_raw_capturing (14). All
//       additive `optional`; no protocol_version bump.
//     * #6 multicam/overlay: SetPreviewLayoutCommand (Command 56) +
//       PreviewLayoutResponse (CommandResponse 24) for single|side-by-side
//       preview; on-demand overlayed export — ExportOverlayedCommand (57) +
//       PollExportCommand (58) + ExportJobResponse (CommandResponse 25);
//       ResponseStatus.LIVE_SESSION_ACTIVE (4). All additive; no
//       protocol_version bump.
//
// Versioning policy:
//   * Use reserved <numbers> and reserved "names" to tombstone removed fields.
//   * Adding optional fields is backward-compatible.
//   * Removing / renaming / renumbering fields requires a coordinated
//     firmware + app release. Bump DeviceInfoResponse.protocol_version.
// ---------------------------------------------------------------------------

// ===========================================================================
// 1. Envelope and framing
// ===========================================================================

message ChunkedPayload {
  string correlation_id = 1;
  uint32 chunk_index    = 2;
  uint32 total_chunks   = 3;
  bytes  data           = 4;
}

message ChunkAck {
  string correlation_id = 1;
  uint32 chunk_index    = 2;

  // Wire demux convention: an ack is sent as a ChunkedPayload-shaped frame with
  // total_chunks (field 3) absent — it decodes to 0. A receiver distinguishes an
  // ack from a real ChunkedPayload by total_chunks == 0 (a real payload always
  // carries total_chunks >= 1). Field 3 is reserved here so a future ChunkAck
  // field cannot collide with that sentinel and silently break the cross-stack
  // demux on either side.
  reserved 3;
}

// ===========================================================================
// 2. Top-level command / response envelopes
// ===========================================================================

message Command {
  string correlation_id = 1;

  oneof payload {
    GetDeviceInfoCommand  get_device_info  = 10;
    ThumbnailRequest      thumbnail        = 11;
    GetTelemetryCommand   get_telemetry    = 12;
    GetMatchStateCommand  get_match_state  = 13;

    MatchControlCommand   match_control    = 21;
    ScoreUpdateCommand    score_update     = 22;
    BannerEventCommand    banner_event     = 23;

    RecordingControlCommand  recording_control  = 30;
    StreamingControlCommand  streaming_control  = 31;
    ListRecordingsCommand    list_recordings    = 32;
    DownloadRequestCommand   download_request   = 33;
    RawCaptureControlCommand raw_capture        = 34;

    SetWifiConfigCommand      set_wifi_config      = 40;
    SetStreamingConfigCommand set_streaming_config = 41;

    // Internet uplink (ethernet / wifi STA) — the cloud-streaming path, separate
    // from the WiFi-Direct preview link. Set persists + applies; Get reads back
    // config + live status.
    SetNetworkConfigCommand   set_network_config   = 42;
    GetNetworkConfigCommand   get_network_config   = 43;

    // Motorized-focus control (continuous AF / manual position on the VCM lens).
    CameraFocusControlCommand camera_focus         = 44;

    FactoryResetCommand   factory_reset    = 50;
    FirmwareUpdateCommand firmware_update  = 51;

    PushSessionConfigCommand push_session_config = 52;

    StartWifiDirectCommand start_wifi_direct = 53;
    StopWifiDirectCommand  stop_wifi_direct  = 54;

    // Overlay layout spec — sent once after PushSessionConfigCommand.
    // Defines the full visual design for overlays; firmware renders exactly
    // what this spec describes. Can be resent to change designs mid-session.
    PushOverlayLayoutCommand push_overlay_layout = 55;

    // #6 multicam / overlay (see overlay-rendering.md + the multicam plan):
    SetPreviewLayoutCommand  set_preview_layout = 56;  // single | side-by-side preview
    ExportOverlayedCommand   export_overlayed   = 57;  // on-demand burn: L1 + overlay timeline
    PollExportCommand        poll_export        = 58;  // poll an export job
    RebootCommand            reboot             = 59;  // restart the camera (new command surface → protocol_version bump)
  }

  reserved 20;
  reserved "match_config";
  reserved 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70;
  reserved "list_teams", "list_team_matches", "create_team", "update_team",
           "delete_team", "set_team_hidden", "add_player", "update_player",
           "remove_player", "add_team_match", "remove_team_match";
  reserved 80, 81, 82, 83;
  reserved "list_sport_presets", "create_sport_preset",
           "update_sport_preset", "delete_sport_preset";
}

message CommandResponse {
  string         correlation_id = 1;
  ResponseStatus status         = 2;
  string         error_message  = 3;

  oneof payload {
    DeviceInfoResponse      device_info       = 10;
    ThumbnailResponse       thumbnail         = 11;
    RecordingListResponse   recording_list    = 12;
    DownloadTokenResponse   download_token    = 13;
    DeviceTelemetry         telemetry         = 14;
    MatchState              match_state       = 15;
    WifiDirectGroupResponse wifi_direct_group = 23;
    PreviewLayoutResponse   preview_layout    = 24;  // reply to SetPreviewLayoutCommand
    ExportJobResponse       export_job        = 25;  // reply to ExportOverlayed / PollExport
    NetworkConfigResponse   network_config    = 26;  // reply to Set/GetNetworkConfig
    CameraFocusResponse     camera_focus      = 27;  // reply to CameraFocusControlCommand
  }

  reserved 16, 17, 18, 19, 20, 21, 22;
  reserved "team_list", "team_match_list", "team", "player", "team_match",
           "sport_preset_list", "sport_preset";
}

enum ResponseStatus {
  OK          = 0;
  ERROR       = 1;
  TIMEOUT     = 2;
  UNSUPPORTED = 3;
  // Retrieval/export refused because a match is live (recording and/or
  // streaming). The on-demand overlay burn would contend with the live x264
  // encode on the no-NVENC Orin Nano — retry once the session ends. #6.
  LIVE_SESSION_ACTIVE = 4;
}

// ===========================================================================
// 2b. #6 multicam / overlay — preview layout + on-demand overlayed export
// ===========================================================================

// Live preview composition. SINGLE = the chosen camera with overlay baked in
// (the broadcast view; default). SIDE_BY_SIDE = cam0 | cam1 composited by the
// firmware into one RTSP stream, clean (no overlay) — a "see both cameras"
// monitoring view. Switched mid-session via SetPreviewLayoutCommand; the RTSP
// URL/port are unchanged (only the composited frame geometry changes).
enum PreviewLayout {
  PREVIEW_LAYOUT_SINGLE       = 0;
  PREVIEW_LAYOUT_SIDE_BY_SIDE = 1;
}

message SetPreviewLayoutCommand {
  PreviewLayout layout = 1;
}

// Reply to SetPreviewLayoutCommand: the active layout plus the new frame
// geometry the firmware now composites, so the app can size its preview box.
message PreviewLayoutResponse {
  PreviewLayout layout = 1;
  uint32        width  = 2;
  uint32        height = 3;
}

// On-demand overlayed export. Recordings store CLEAN post-processed video (L1)
// plus an overlay timeline as DATA — never a burned-in copy. To retrieve the
// overlaid version the app asks the firmware to render it on demand: the
// firmware replays the overlay timeline onto L1, encodes L2, exposes it for one
// download, then deletes it. REFUSED while a match is live (CommandResponse
// status LIVE_SESSION_ACTIVE) — the software encode must not contend with the
// live broadcast encode on the no-NVENC Orin Nano.
message ExportOverlayedCommand {
  // The clean recording to overlay — a final-match recording id, or a raw
  // capture_group_id (see RecordingMetadata).
  string recording_id = 1;
}

// Poll a running export job for completion.
message PollExportCommand {
  string job_id = 1;
}

enum ExportJobState {
  EXPORT_JOB_UNKNOWN = 0;  // no such job (e.g. firmware restarted since the request)
  EXPORT_JOB_PENDING = 1;  // queued
  EXPORT_JOB_RUNNING = 2;  // burning L2
  EXPORT_JOB_READY   = 3;  // done — `token` is set
  EXPORT_JOB_FAILED  = 4;  // see CommandResponse.error_message
}

// Reply to BOTH ExportOverlayedCommand (a new job, state PENDING) and
// PollExportCommand (the job's current state).
message ExportJobResponse {
  string         job_id = 1;
  ExportJobState state  = 2;
  // Set only when state == EXPORT_JOB_READY: a one-shot download token for the
  // burned L2, identical transport to a normal recording download. The firmware
  // deletes the L2 once the download completes or the token expires.
  optional DownloadTokenResponse token = 3;
}

// ===========================================================================
// 3. Parameterless commands
// ===========================================================================

message GetDeviceInfoCommand  {}
message GetTelemetryCommand   {}
message GetMatchStateCommand  {}
message ListRecordingsCommand {}
message FactoryResetCommand   {}
message FirmwareUpdateCommand {}

// Restart the camera. Parameterless by design — no BLE-derived data reaches the
// reboot exec path. A new command surface, so firmware bumps
// DeviceInfoResponse.protocol_version and the app gates the Reboot action on it.
message RebootCommand {}

// A capture/encode mode: resolution + frame rate. Used both as an app→camera
// setting (RecordingControlCommand/StreamingControlCommand.quality) and a
// camera→app capability advertisement (DeviceInfoResponse.supported_modes).
message VideoQuality {
  uint32 width  = 1;
  uint32 height = 2;
  uint32 fps    = 3;
}

// ===========================================================================
// 4. Telemetry / device info
// ===========================================================================

message DeviceInfoResponse {
  string device_id        = 1;
  string name             = 2;
  string firmware_version = 3;
  string model            = 4;
  uint32 protocol_version = 5;  // consumers MUST read this and compare against the
                                // contract version they were built against; on
                                // mismatch, surface a clean version-skew error and
                                // refuse the session — do NOT silently proceed.
  // Capture/encode modes the firmware actually supports, so the app offers only
  // real record/stream quality options instead of a blind dropdown. Empty on
  // firmware that predates this field (app falls back to a disabled picker).
  repeated VideoQuality supported_modes = 6;
}

message DeviceTelemetry {
  uint64 storage_free_bytes  = 1;
  uint64 storage_total_bytes = 2;

  WifiState wifi_state         = 3;
  string    wifi_ssid          = 4;
  sint32    wifi_signal_dbm    = 5;
  bool      internet_reachable = 6;

  float  temp_celsius   = 7;
  float  ram_used_pct   = 8;
  float  cpu_used_pct   = 9;
  uint64 uptime_seconds = 10;

  bool is_recording = 11;
  bool is_streaming = 12;

  // optional so an absent value (device has no battery) is distinguishable from
  // a real 0% reading via has_battery_level_pct().
  optional uint32 battery_level_pct = 13;

  // Raw dual-camera capture running state, mirroring is_recording /
  // is_streaming. absent ⇒ false. Reflects RawCaptureControlCommand lifecycle,
  // independent of is_recording.
  optional bool is_raw_capturing = 14;
}

enum WifiState {
  WIFI_UNKNOWN      = 0;
  WIFI_DISABLED     = 1;
  WIFI_DISCONNECTED = 2;
  WIFI_CONNECTED    = 3;
}

message ThumbnailRequest {
  uint32 width   = 1;
  uint32 height  = 2;
  uint32 quality = 3;
}

message ThumbnailResponse {
  bytes  jpeg_bytes        = 1;
  uint64 capture_timestamp = 2;  // Unix epoch milliseconds (wall clock).
}

// ===========================================================================
// 5. Shared enums
// ===========================================================================

enum Sport {
  SPORT_UNKNOWN           = 0;
  SPORT_SOCCER            = 1;
  SPORT_BASKETBALL        = 2;
  SPORT_AMERICAN_FOOTBALL = 3;
  SPORT_VOLLEYBALL        = 4;
  SPORT_HOCKEY            = 5;
  SPORT_BASEBALL          = 6;
  SPORT_RUGBY             = 7;
  SPORT_OTHER             = 99;
}

enum PlayerPosition {
  POSITION_UNKNOWN  = 0;
  POSITION_KEEPER   = 1;
  POSITION_DEFENDER = 2;
  POSITION_MID      = 3;
  POSITION_FORWARD  = 4;
  POSITION_OTHER    = 99;
}

// ===========================================================================
// 6. Match — event-push model
//
// The app is the match timer and score authority. The camera receives events
// and reacts: it renders overlays on the RTSP stream and baked recording,
// and maintains a display-only scoreboard clock. The camera never holds
// authoritative match state — it only reflects what the app last pushed.
// ===========================================================================

message MatchControlCommand {
  MatchControlAction action = 1;
  uint32             period = 2;
}

enum MatchControlAction {
  MATCH_ACTION_UNKNOWN  = 0;
  MATCH_KICKOFF         = 1;
  MATCH_PERIOD_END      = 2;
  MATCH_PERIOD_START    = 3;
  MATCH_FINAL_WHISTLE   = 4;
  MATCH_CLOCK_PAUSE     = 5;
  MATCH_CLOCK_RESUME    = 6;
}

message ScoreUpdateCommand {
  string team_id = 1;
  sint32 delta   = 2;
}

message BannerEventCommand {
  string              template_id = 1;
  map<string, string> params      = 2;
  uint32              duration_s  = 3;
  string              player_id   = 4;
}

message MatchState {
  MatchStatus status           = 1;
  uint32      current_period   = 2;
  uint32      time_remaining_s = 3;
  uint32      score_a          = 4;
  uint32      score_b          = 5;
  string      team_a_id        = 6;
  string      team_b_id        = 7;
  uint64      updated_at       = 8;  // Unix epoch milliseconds (wall clock).
}

enum MatchStatus {
  MATCH_STATUS_UNKNOWN = 0;
  MATCH_NOT_STARTED    = 1;
  MATCH_ACTIVE         = 2;
  MATCH_PAUSED         = 3;
  MATCH_HALF_TIME      = 4;
  MATCH_FINISHED       = 5;
}

// ===========================================================================
// 7. Recording / streaming
// ===========================================================================

message RecordingControlCommand {
  RecordingAction action = 1;
  // Optional record quality/fps, independent of the stream quality. Applied at
  // session start by (re)configuring the encode pipeline; unset => firmware
  // default. Does NOT affect the fixed-resolution raw dual-recording. The app
  // offers only DeviceInfoResponse.supported_modes.
  optional VideoQuality quality = 2;
  // Training-proxy pairing key, minted by the APP and sent on RECORDING_START.
  // When present, firmware couples the always-on dual-camera training proxy to
  // THIS record lifecycle (start the proxy on START, stop on STOP) and uses the
  // id to (a) NAME the final MP4 on disk and (b) stamp the two proxy files'
  // RecordingMetadata (is_raw=true, camera_index, capture_group_id). It is NOT
  // written into the final MP4's own RecordingMetadata — that stays
  // is_raw=false with capture_group_id absent (see RecordingMetadata JOINT
  // INVARIANT below). MUST be absent on RECORDING_STOP. Opaque string (UUID v4
  // recommended). Additive/optional: unset => record runs with no coupled
  // proxy (backward-compatible with pre-coupling apps).
  optional string capture_group_id = 3;
}

// Independent raw dual-camera training capture, distinct from
// RecordingControlCommand. "RAW_DUAL" = both physical sensors captured raw in
// one session, yielding two per-camera files (camera_index 0 and 1) paired by
// a shared capture_group_id. Runs concurrently with final-match recording
// (recording_control) and streaming (streaming_control) — its lifecycle does
// not touch is_recording.
//
// Reuses RecordingAction but only RECORDING_START / RECORDING_STOP are honored.
// `action` is proto3 `optional` so firmware can distinguish a genuinely unset
// field (has_action()==false) from an explicit value. The app MUST always set
// it; firmware behavior (not this contract) answers an absent `action` or the
// zero-value RECORDING_ACTION_UNKNOWN, plus PAUSE / RESUME, with UNSUPPORTED /
// ERROR — it must NEVER treat absent/UNKNOWN as START.
//
// capture_group_id is minted by the APP and sent on START; firmware stamps it
// onto both per-camera files' RecordingMetadata (see RecordingMetadata fields
// 8–10). The app MUST set it on RECORDING_START and firmware MUST reject a
// START lacking it; it MUST be absent on RECORDING_STOP and firmware MUST
// ignore it there. Treat it as an OPAQUE string: firmware MUST stamp it onto
// both files verbatim — no inspection, truncation, or re-encoding (UUID v4
// recommended; compared only by equality). This is the app-as-source-of-truth
// pairing key, so the response stays status-only (no payload) — like
// RecordingControlCommand, this is NOT in the CommandResponse payload oneof.
// The app already knows the id it minted, so no payload is needed to learn it.
message RawCaptureControlCommand {
  optional RecordingAction action = 1;
  optional string capture_group_id = 2;
}

enum RecordingAction {
  RECORDING_ACTION_UNKNOWN = 0;
  RECORDING_START          = 1;
  RECORDING_STOP           = 2;
  RECORDING_PAUSE          = 3;
  RECORDING_RESUME         = 4;
}

message StreamingControlCommand {
  StreamingAction action      = 1;
  string          destination = 2;
  // Optional stream quality/fps, independent of the record quality (e.g. record
  // 1080p while streaming 720p). Unset => firmware default. The app offers only
  // DeviceInfoResponse.supported_modes.
  optional VideoQuality quality = 3;
}

enum StreamingAction {
  STREAMING_ACTION_UNKNOWN = 0;
  STREAMING_START          = 1;
  STREAMING_STOP           = 2;
}

// ===========================================================================
// Camera configuration — motorized focus
// ===========================================================================

// Continuous-autofocus / manual-focus control for the motorized VCM lens.
// `mode` selects the behavior; `focus_position` is honored ONLY in
// FOCUS_MODE_MANUAL and drives the VCM to a raw DAC code. `camera_index` targets
// one physical sensor (0/1, matching RecordingMetadata.camera_index); absent =>
// apply to every camera. If the motorized-lens hardware is absent, firmware
// degrades to manual-only and reports autofocus_available=false in
// CameraFocusResponse — it MUST NOT fail the command. New command surface →
// protocol_version bump.
message CameraFocusControlCommand {
  CameraFocusMode mode = 1;
  // Raw VCM DAC code (typical range 0–1023, lens-dependent). Honored only when
  // mode == FOCUS_MODE_MANUAL; ignored (may be absent) in FOCUS_MODE_AUTO. A
  // manual set-position preempts any autofocus hunt in progress.
  optional uint32 focus_position = 2;
  // Physical sensor to target (0 = primary, 1 = secondary). Absent => all cameras.
  optional uint32 camera_index = 3;
}

enum CameraFocusMode {
  FOCUS_MODE_AUTO   = 0;  // continuous contrast-detect autofocus (default)
  FOCUS_MODE_MANUAL = 1;  // hold focus_position; suspends autofocus hunting
}

// Reply to CameraFocusControlCommand. Reports the effective mode + position and
// whether motorized autofocus hardware was detected at boot. autofocus_available
// == false means the lens is fixed: AUTO is a no-op and a manual set-position
// cannot move the (absent) VCM.
message CameraFocusResponse {
  CameraFocusMode mode = 1;
  optional uint32 focus_position = 2;  // last-commanded / current VCM code
  bool autofocus_available = 3;        // motorized VCM lens detected at boot
}

message RecordingMetadata {
  string id           = 1;
  uint64 duration_s   = 2;
  uint64 size_bytes   = 3;
  uint64 started_at   = 4;
  string sport        = 5;
  string teams        = 6;
  string thumbnail_id = 7;

  // Raw dual-camera capture identity (see RawCaptureControlCommand). Absent on
  // a final-match recording. JOINT INVARIANT: when is_raw == true, BOTH
  // camera_index and capture_group_id MUST be present; when is_raw is
  // absent/false, BOTH MUST be absent. A consumer MUST treat a raw file lacking
  // either as malformed.
  //
  // is_raw: absent ⇒ false ⇒ final recording.
  optional bool   is_raw           = 8;
  // camera_index: IDENTITY KEY, 0/1, pinned to the physical nvarguscamerasrc
  // sensor-id (0 = primary sensor, 1 = secondary). Same referent on both
  // stacks — front/back must NOT be assumed oppositely. Meaningful only when
  // is_raw == true.
  optional uint32 camera_index     = 9;
  // capture_group_id: pairs the cam-0 / cam-1 files of one raw session. Equals
  // the app-minted id sent on RawCaptureControlCommand START. Absent for final
  // recordings.
  optional string capture_group_id = 10;
}

message RecordingListResponse {
  repeated RecordingMetadata recordings = 1;
}

message DownloadRequestCommand {
  string recording_id = 1;
}

message DownloadTokenResponse {
  string recording_id = 1;
  string http_url     = 2;
  string auth_token   = 3;
  uint64 expires_at   = 4;
}

// ===========================================================================
// 8. Configuration
// ===========================================================================

message SetWifiConfigCommand {
  string ssid     = 1;
  string password = 2;
}

message SetStreamingConfigCommand {
  StreamingConfig config = 1;
}

message StreamingConfig {
  string youtube_stream_key   = 1;
  string instagram_stream_key = 2;
  string custom_rtmp_url      = 3;
}

// ===========================================================================
// 9. Session push
// ===========================================================================

message PushSessionConfigCommand {
  string match_uuid            = 1;
  string user_uuid             = 2;
  string sport                 = 3;
  int32  num_periods           = 4;
  int32  period_length_seconds = 5;
  optional string rtmp_url     = 6;
  optional string stream_key   = 7;
  string video_output_path     = 8;
  string thumbnail_output_path = 9;

  string team_a_id        = 10;
  string team_b_id        = 11;
  string team_a_name      = 12;
  string team_b_name      = 13;
  string team_a_color_hex = 14;
  string team_b_color_hex = 15;
}

// ===========================================================================
// 10. WiFi Direct negotiation (BLE-transported)
// ===========================================================================

message StartWifiDirectCommand {}

message StopWifiDirectCommand {}

message WifiDirectGroupResponse {
  string ssid           = 1;
  string psk            = 2;
  string group_owner_ip = 3;
  uint32 preview_port   = 4;
  uint32 download_port  = 5;
  string role           = 6;
}

// ===========================================================================
// 10b. Network uplink (cloud-streaming path — SEPARATE from WiFi-Direct)
//
// The camera reaches the internet (RTMP egress) over a configurable uplink:
// ethernet and/or a WiFi STA, each enable/disable with DHCP-or-static IP. This
// is independent of the WiFi-Direct GO that serves the phone its live preview.
// `dhcp = true` means DHCP (address/gateway/dns ignored); `dhcp = false` means
// static and `address` is CIDR ("10.0.0.5/24"). Fields map 1:1 to the firmware
// uplink config (uplink-config.hpp).
// ===========================================================================

message EthernetUplinkConfig {
  bool   enabled = 1;
  bool   dhcp    = 2;
  string address = 3;
  string gateway = 4;
  string dns     = 5;
}

message WifiUplinkConfig {
  bool   enabled  = 1;
  string ssid     = 2;
  string password = 3;
  bool   dhcp     = 4;
  string address  = 5;
  string gateway  = 6;
  string dns      = 7;
}

message NetworkConfig {
  EthernetUplinkConfig ethernet = 1;
  WifiUplinkConfig     wifi     = 2;
}

// Set the camera's uplink config — persisted + applied. Reply: NetworkConfigResponse.
message SetNetworkConfigCommand {
  NetworkConfig config = 1;
}

// Read the camera's current uplink config + live status. Reply: NetworkConfigResponse.
message GetNetworkConfigCommand {}

// Current config echoed back plus per-interface live status (what the app shows).
message NetworkConfigResponse {
  NetworkConfig config = 1;

  bool   ethernet_up      = 2;
  string ethernet_address = 3;  // current CIDR; empty when down
  bool   wifi_up          = 4;
  string wifi_status      = 5;  // "connected" / "unavailable: ..." / "failed: ..."
}

// ===========================================================================
// 11. Overlay layout system
//
// The app is the only source of overlay design. The camera never hard-codes
// scoreboard layouts, fonts, or colors — it renders exactly what the layout
// spec describes. The app preview and the camera's live stream + recorded
// footage stay visually equivalent within a defined tolerance (the two stacks
// use independent rasterizers, so byte-identical output is not the goal). The
// normative rendering rules and tolerance live in overlay-rendering.md.
//
// Command ordering (session bring-up): the app MUST issue these in order —
//   StartWifiDirectCommand -> PushSessionConfigCommand -> PushOverlayLayoutCommand
//   -> RecordingControlCommand. Rationale: PushSessionConfigCommand provisions the
//   streaming sinks (RTMP / preview), which require the WiFi-Direct group already
//   up; sending session config before the group exists fails to bind the sinks.
//
// Design flow:
//   1. App sends PushOverlayLayoutCommand (after PushSessionConfigCommand,
//      before RecordingControlCommand).
//   2. Camera stores the layout in session memory.
//   3. Events (ScoreUpdateCommand, MatchControlCommand, BannerEventCommand)
//      push data updates; camera re-renders affected elements automatically.
//   4. App renders the same layout spec as a Flutter overlay on its preview.
//
// Coordinate space:
//   All coordinates are in logical canvas pixels (canvas_width × canvas_height).
//   x increases right; y increases down; (0,0) is top-left.
//   The camera maps canvas coordinates to its output resolution; the app maps
//   them to its preview surface. Both use the same spec.
//
// Z-order:
//   z = 0  →  video background (always present; never declared in elements)
//   z > 0  →  overlay elements; higher z is drawn on top
// ===========================================================================

message PushOverlayLayoutCommand {
  OverlayLayout layout = 1;
}

message OverlayLayout {
  uint32 canvas_width  = 1;  // logical pixels, e.g. 1920
  uint32 canvas_height = 2;  // logical pixels, e.g. 1080

  // Persistent elements: always visible once the layout is applied.
  // Use for the scoreboard background, team names, score, clock, etc.
  repeated OverlayElement elements = 3;

  // Event-triggered templates: shown transiently when a matching
  // BannerEventCommand(template_id) arrives; hidden after duration_ms.
  // Text content may use {{param_name}} substitution with BannerEventCommand.params.
  repeated OverlayTemplate templates = 4;
}

// A single visual element in the overlay.
message OverlayElement {
  string         id      = 1;  // unique within the layout; used for updates
  OverlayShape   shape   = 2;
  OverlayRect    bounds  = 3;
  OverlayStyle   style   = 4;
  OverlayBinding binding = 5;  // for TEXT shapes: live data source; default BINDING_STATIC
  optional bool  visible = 6;  // optional: absent => true (renders). See
                              // overlay-rendering.md "Element defaults".
}

// Position and layer of an element in canvas space.
message OverlayRect {
  float  x1 = 1;  // left edge (canvas pixels)
  float  y1 = 2;  // top edge (canvas pixels)
  uint32 z  = 3;  // layer; 0 = video; higher = closer to viewer
  float  x2 = 4;  // right edge (canvas pixels)
  float  y2 = 5;  // bottom edge (canvas pixels)
}

// Visual style properties.
message OverlayStyle {
  string     fill_color    = 1;  // hex e.g. "#1A1A1A"; empty = transparent
  string     text_color    = 2;  // hex; for TEXT shapes
  optional float opacity    = 3;  // 0.0–1.0; optional: absent => 1.0 (opaque).
                                  // See overlay-rendering.md "Element defaults".
  float      corner_radius = 4;  // canvas pixels; 0 = sharp corners
  string     font_family   = 5;  // e.g. "monospace"; firmware uses nearest available
  float      font_size     = 6;  // canvas pixels
  TextAlign  text_align    = 7;
  FontWeight font_weight   = 8;
  string     static_text   = 9;  // content when binding = BINDING_STATIC; also
                                  // used as {{param}} template in OverlayTemplate
}

// An event-triggered template: activated by BannerEventCommand(event_type),
// shown for duration_ms, then removed. Text in style.static_text may contain
// {{param_name}} placeholders substituted from BannerEventCommand.params.
message OverlayTemplate {
  string   event_type  = 1;  // matches BannerEventCommand.template_id
  uint32   duration_ms = 2;  // how long to show this overlay
  repeated OverlayElement elements = 3;
}

// Shape types.
enum OverlayShape {
  SHAPE_UNKNOWN = 0;
  SHAPE_RECT    = 1;  // filled rectangle
  SHAPE_TEXT    = 2;  // text within bounds; wraps if needed
  SHAPE_CIRCLE  = 3;  // ellipse inscribed in bounds
}

// Data bindings for TEXT elements.
// When bound, the camera updates the element's rendered text automatically
// whenever the corresponding data changes via an event command.
enum OverlayBinding {
  BINDING_STATIC       = 0;  // static text from style.static_text
  BINDING_SCORE_A      = 1;  // home score as a plain number, e.g. "2"
  BINDING_SCORE_B      = 2;  // away score as a plain number, e.g. "1"
  BINDING_SCORE_VS     = 3;  // formatted "2 – 1"
  BINDING_TEAM_A_NAME  = 4;  // from PushSessionConfigCommand.team_a_name
  BINDING_TEAM_B_NAME  = 5;  // from PushSessionConfigCommand.team_b_name
  BINDING_MATCH_CLOCK  = 6;  // "MM:SS" — display-only clock driven by MatchControlCommand
  BINDING_PERIOD_LABEL = 7;  // "P1", "P2", "HT", "FT" — driven by MatchControlCommand
}

enum TextAlign {
  TEXT_ALIGN_LEFT   = 0;
  TEXT_ALIGN_CENTER = 1;
  TEXT_ALIGN_RIGHT  = 2;
}

enum FontWeight {
  FONT_WEIGHT_NORMAL = 0;
  FONT_WEIGHT_BOLD   = 1;
}
