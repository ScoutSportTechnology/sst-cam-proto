name: release-beta

# Branch-scoped workflow that OWNS `release/**`. On PRs into a release/* branch it
# runs the CI check jobs (lint + breaking + build) that satisfy the
# release-branches ruleset's required status checks; on push/dispatch to
# release/* it mints a beta prerelease.
#
# beta/rc tag/release: the base X.Y.Z is taken from the branch name; the shared
# resolve-version action (mode: release) appends the next -beta.N, or -rc.N once
# promote-rc.yml re-tagged the hardware-validated beta as rc.1. Betas iterate on the
# branch — each push bumps the counter. The beta tag's commit is what firmware +
# app vendor (submodule pin) to prove the candidate contract in integration
# before promotion to stable. Artifact-free: the tag IS the release, NO asset.
#
# Fail fast if the branch is not named release/X.Y.Z: the resolver rejects a base
# that is not a valid X.Y.Z, so a malformed branch name exits non-zero.
#
# Uses the default GITHUB_TOKEN (contents:write); the "Release Tags" ruleset
# permits compliant v* tags.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["release/**"]
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job names lint and breaking are the required status checks wired into the
  # branch rulesets — keep them byte-identical. `build` (buf build) is the
  # codegen-compile smoke; it is wired in alongside them. These satisfy the
  # release-branches ruleset on release/* PRs. They run on PRs only; push/
  # dispatch goes straight to the beta job.

  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          # This job only lints — disable the other steps the action runs.
          format: false
          breaking: false
          push: false
          # Org disables Actions commenting on PRs (GITHUB_TOKEN can't write
          # issue comments) — failures surface as annotations + job status.
          pr_comment: false

  breaking:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so buf can diff against the main branch.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # buf breaking vs main; a wire break passes only when the PR title
      # declares it (`type!:` / `type(scope)!:`). See the script header.
      - name: buf breaking (declared breaks allowed)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/breaking-gate.sh

  build:
    # Codegen-compile smoke: `buf build` compiles the schema into a
    # FileDescriptorSet — the cheapest "the schemas still compile" check with no
    # language toolchain. This is the alpha-ladder "codegen succeeds" rung.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          breaking: false
          push: false
          # buf-action runs `buf build` as part of setup/validation; keep the
          # other steps off so this job is the compile-smoke only.
          pr_comment: false

  beta:
    # Push to a release/* branch or manual dispatch — never on PRs (those run the
    # check jobs above).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the resolver sees this base's -beta.N / -rc.N
          # counters.
          fetch-depth: 0

      - name: Resolve next beta or rc tag
        id: ver
        # mode: release takes X.Y.Z from the release/X.Y.Z branch name (fails fast
        # on any other shape) and mints beta.N, or rc.N once promote-rc ran.
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: release

      - name: Publish beta/rc prerelease (no asset)
        if: steps.ver.outputs.released == 'true'
        uses: ScoutSportTechnology/.github/actions/publish-release@v1.1.0
        with:
          tag: ${{ steps.ver.outputs.tag }}
          prerelease: "true"
