name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Default GITHUB_TOKEN is sufficient here. proto produces no build
          # artifact — release-please only cuts the tag + GitHub Release +
          # changelog and bumps gen/dart/pubspec.yaml. Creating a compliant
          # semver tag is allowed by the "Release Tags" ruleset (it blocks
          # delete/update/force-push and enforces the v* naming pattern, but
          # not creation), so no App token or bypass actor is required.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
