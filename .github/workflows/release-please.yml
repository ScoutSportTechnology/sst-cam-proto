name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # IMPORTANT: this MUST be the org GitHub App installation token
          # (stored as the RELEASE_PLEASE_TOKEN repo/org secret), NOT the
          # default GITHUB_TOKEN. The default token carries a recursion guard:
          # tags/commits it pushes do NOT trigger downstream workflows, and it
          # cannot satisfy the tag ruleset's App-bypass actor. The App token is
          # required so the release tag fires and the protected-tag push is
          # allowed. See release-please-config.json.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
