name: release

# Owns `main`. On push (the release/X.Y.Z -> main merge) it promotes the
# hardware-validated candidate to stable: the shared promote action finds the
# highest vX.Y.Z-rc.N, tags vX.Y.Z on the same commit and cuts the stable
# Release. It refuses to promote a version that never reached rc.
#
# NO build and NO asset: "main never builds" is structural here — this repo has
# no build artifact, the tag IS the release.
#
# After promotion (manual follow-up): delete release/X.Y.Z and open a
# `main -> development` PR.

on:
  push:
    branches: [development, "release/**", main]
  workflow_dispatch:
    inputs:
      to:
        description: "Release or promote"
        type: choice
        options: ["", rc]
        default: ""
      version:
        description: "Alpha base override or X.Y.Z to promote (optional)"
        required: false
        default: ""
      bump:
        description: "Alpha bump override"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref_name }}
          TO: ${{ inputs.to }}
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          case "$REF:$TO" in
            development:|main:|release/*:|release/*:rc) ;;
            *) echo '::error::Select development for alpha, release/X.Y.Z for beta or rc, or main for stable'; exit 1 ;;
          esac
          if [ "$REF" != development ] && [ -n "$BUMP" ]; then
            echo '::error::bump applies only to development alpha releases'; exit 1
          fi
          if [[ "$REF" == release/* && "$TO" != rc && -n "$VERSION" ]]; then
            echo '::error::version applies only to alpha or promotion'; exit 1
          fi
  version:
    needs: validate
    if: github.ref_name != 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.to != 'rc'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      released: ${{ steps.ver.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        if: ${{ (github.ref_name == 'development' && hashFiles('.github/workflows/release-alpha.yml') == '') || (github.ref_name != 'development' && hashFiles('.github/workflows/release-beta.yml') == '') }}
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: ${{ github.ref_name == 'development' && 'alpha' || 'release' }}
          version: ${{ github.ref_name == 'development' && inputs.version || '' }}
          bump: ${{ inputs.bump }}

  publish:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      prerelease: true
      notes: ""
    permissions:
      contents: write

  promote:
    needs: validate
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.to == 'rc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote existing release
        id: promoted
        if: ${{ github.ref_name == 'main' || hashFiles('.github/workflows/promote-rc.yml') == '' }}
        uses: ScoutSportTechnology/.github/actions/promote@v1.1.0
        with:
          to: ${{ github.ref_name == 'main' && 'stable' || 'rc' }}
          version: ${{ inputs.version }}
      - name: Post-promotion reminder (manual maintainer steps)
        if: github.ref_name == 'main'
        run: |
          {
            echo "## Promoted ${{ steps.promoted.outputs.tag }} (from ${{ steps.promoted.outputs.source }})"
            echo ""
            echo "- Delete the merged \`release/${{ steps.promoted.outputs.base }}\` branch."
            echo "- Open a \`main -> development\` PR so the stable tag's history is in the integration branch."
          } >> "$GITHUB_STEP_SUMMARY"
